<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pjassu | Bio-Logic Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card">
        <h1>🧬 Bio-Logic Terminal</h1>
        <div class="stats">Score: <span id="score">0</span></div>
        
        <p id="question">Loading puzzle...</p>
        <input type="text" id="answer" placeholder="Type answer here..." autocomplete="off">
        <button onclick="checkAnswer()">Execute</button>
        <p id="feedback"></p>
    </div>

    <div class="dna-container">
        <div class="dna" id="dna"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
